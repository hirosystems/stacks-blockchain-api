version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
    # Disable version updates for npm dependencies
    # https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates#open-pull-requests-limit
    open-pull-requests-limit: 0

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
    # Disable version updates for npm dependencies
    open-pull-requests-limit: 0

  # Maintain the Node.js base image in the Dockerfile (tag + digest)
  - package-ecosystem: "docker"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Node major upgrades are done manually
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
